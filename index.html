<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニートシート</title>
  <meta name="site-title" content="ニートシート">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect x='3' y='4' width='16' height='5' rx='2.5' fill='%233B5BDB'/><rect x='3' y='11.5' width='22' height='5' rx='2.5' fill='%232B8A3E'/><rect x='3' y='19' width='11' height='5' rx='2.5' fill='%23D6336C'/></svg>">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/"><svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="16" height="5" rx="2.5" fill="#3B5BDB"/><rect x="3" y="11.5" width="22" height="5" rx="2.5" fill="#2B8A3E"/><rect x="3" y="19" width="11" height="5" rx="2.5" fill="#D6336C"/></svg><span id="brand">ニートシート</span></a>
    <nav class="topnav" id="topnav" aria-label="カテゴリ"></nav>
    <button class="search-trigger" id="searchBtn" aria-label="検索を開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <span>検索</span>
      <kbd>Ctrl K</kbd>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="表示モードを切り替え">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="ページ一覧"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="sheet" id="main" tabindex="-1">
      <p class="loading">読み込み中…</p>
    </main>
  </div>

  <dialog class="search" id="searchDialog" aria-label="検索">
    <div class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="searchInput" type="search" autocomplete="off" placeholder="関数名・やりたいことで探す（例：LAG、年齢、NULL）">
      <kbd>Esc</kbd>
    </div>
    <ul class="results" id="results" role="listbox"></ul>
  </dialog>

  <script src="assets/vendor/marked.js"></script>
  <script src="assets/vendor/prism.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
